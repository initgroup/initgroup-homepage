# Optional Render Static Site; Cafe24 uses dist/site directly.
services:
  - type: web
    name: initgroup-homepage-static
    runtime: static
    repo: https://github.com/initgroup/initgroup-homepage
    branch: main
    autoDeployTrigger: commit
    buildCommand: bash scripts/build-render-static.sh
    staticPublishPath: .render-static
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'"
      - path: /*
        name: Cache-Control
        value: no-cache
