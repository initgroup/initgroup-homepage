services:
  - type: web
    name: initgroup-homepage
    runtime: python
    repo: https://github.com/initgroup/initgroup-homepage
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python scripts/build_site.py --check && python scripts/i18n_catalog.py --check
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
