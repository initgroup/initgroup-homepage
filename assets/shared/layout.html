<template id="header-bar">
        <div class="header-inner">
            <a class="brand" href="{{root}}index.html" aria-label="인아이티 홈">
                <img src="{{root}}assets/images/brand/init-logo.png" alt="iNIT">
                <span>Data Intelligence</span>
            </a>

            <nav class="desktop-nav" aria-label="주요 메뉴" data-desktop-nav>
{{desktopLinks}}
            </nav>

            <div class="header-actions">
                <div class="language-switcher" role="group" aria-label="언어 선택" data-language-switcher>
                    <button type="button" data-language="ko" aria-pressed="true">Korea</button>
                    <button type="button" data-language="en" aria-pressed="false">English</button>
                </div>
                <a class="header-contact" href="{{path:contact}}" data-i18n="navigation.contact">{{text:contact}}</a>
{{menuToggle}}
            </div>
        </div>
</template>

<template id="header-compact">
    <header class="site-header" data-site-header>
{{include:header-bar}}
    </header>
</template>

<template id="header">
    <header class="site-header" data-site-header>
{{include:header-bar}}
        {{subNavigation}}


        <div id="hoverNavigation" class="hover-navigation" data-hover-menu hidden>
            <div class="hover-navigation-inner shell">
{{hoverSections}}
            </div>
        </div>

        <div id="siteNavigation" class="full-navigation" data-mobile-menu hidden>
            <div class="mobile-navigation-head shell">
                <div>
                    <span>INIT / ALL MENU</span>
                    <strong>전체 메뉴를 한 화면에서 확인하세요.</strong>
                </div>
                <button type="button" aria-label="전체 메뉴 닫기" data-menu-close>닫기 <i aria-hidden="true">×</i></button>
            </div>

            <div class="site-map-layout shell">
                <div class="site-map-intro">
                    <p>DATA INTELLIGENCE</p>
                    <strong>통계·데이터 분석과<br>업무 시스템 전문기업.</strong>
                    <a href="{{root}}contact/index.html">프로젝트·제품 문의 <span aria-hidden="true">↗</span></a>
                </div>

                <nav class="site-map-grid" aria-label="전체 메뉴">
{{mobileSections}}
                </nav>
            </div>
        </div>
        <button class="menu-backdrop" type="button" aria-label="전체 메뉴 닫기" data-menu-backdrop hidden></button>
    </header>
</template>

<template id="menu-toggle">
                <button class="menu-toggle" type="button" aria-label="전체 메뉴 열기" aria-controls="hoverNavigation siteNavigation" aria-expanded="false" data-menu-toggle>
                    <span class="menu-toggle-label">전체 메뉴</span>
                    <span class="menu-toggle-icon" aria-hidden="true"><i></i><i></i><i></i></span>
                </button>
</template>

<template id="mobile-actions">
    <div class="mobile-action-bar" aria-label="{{ariaLabel}}">
        <a href="{{firstHref}}"><span data-i18n="{{firstKey}}">{{firstLabel}}</span></a>
        <a href="{{secondHref}}"><span data-i18n="{{secondKey}}">{{secondLabel}}</span> <span aria-hidden="true">↗</span></a>
    </div>
</template>

<template id="navigation-link">
<a href="{{href}}"{{attributes}} data-i18n="{{labelKey}}">{{label}}</a>
</template>

<template id="navigation-section">
                <section {{sectionAttributes}}>
                    <a class="{{rootClass}}" href="{{href}}"><span>{{number}}</span><strong data-i18n="{{labelKey}}">{{label}}</strong></a>
                    <ul>
{{links}}
                    </ul>
                </section>
</template>

<template id="scroll-progress">
    <div class="scroll-progress" aria-hidden="true"><i data-scroll-progress></i></div>
</template>

<template id="skip-link">
    <p class="visually-hidden" role="status" aria-live="polite" data-page-status></p>
    <a class="skip-link" href="#mainContent">본문으로 바로가기</a>
</template>

<template id="sub-navigation">
        <div class="page-sub-navigation" data-page-sub-navigation data-navigation-mode="{{mode}}">
            <div class="page-sub-navigation-inner shell">
                <a class="page-sub-navigation-root" href="{{href}}"><strong data-i18n="{{labelKey}}">{{label}}</strong></a>
                <nav class="page-sub-navigation-links" aria-label="{{ariaLabel}}">
{{links}}
                </nav>
            </div>
        </div>
</template>
